name: rescuelink
description: Community incident reporting and tracking application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.4

  # Local storage (offline-first)
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # Network
  connectivity_plus: ^6.1.3

  # Location
  geolocator: ^13.0.2

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Media
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utils
  intl: ^0.20.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.13
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
